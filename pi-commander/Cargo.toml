[package]
name = "pi-commander"
version = "0.1.0"
edition = "2021"
description = "Agent coordination hub — spawn and supervise headless pi agents per project, with TUI, broker TTS, Telegram, and a REST API"
readme = "README.md"
license = "MIT"
keywords = ["cli", "agent", "tui", "pi", "orchestration"]
categories = ["command-line-utilities"]
include = ["src/**/*", "Cargo.toml", "README.md", "LICENSE", "projects.example.yaml"]

[lib]
name = "pi_commander"
path = "src/lib.rs"

[[bin]]
name = "pi-commander"
path = "src/main.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.28"
dirs = "5"
ratatui = "0.29"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process", "io-util", "sync", "fs", "signal"] }
tower-http = { version = "0.6", features = ["timeout"] }
unicode-width = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
assert_cmd = "2"